<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle (optional, remove if you want transparent) -->
  <circle cx="100" cy="100" r="95" fill="#FEFAE0"/>
  
  <!-- Clay pot body -->
  <path d="M 55 110 
           Q 55 155, 100 155 
           Q 145 155, 145 110 
           L 145 100 
           L 55 100 Z" 
        fill="#2D6A4F"/>
  
  <!-- Pot rim -->
  <rect x="50" y="92" width="100" height="12" rx="6" fill="#1B4332"/>
  
  <!-- Pot lid handle -->
  <ellipse cx="100" cy="90" rx="8" ry="4" fill="#1B4332"/>
  
  <!-- Steam swirl 1 -->
  <path d="M 85 75 Q 80 65, 85 55 Q 90 45, 85 35" 
        stroke="#E76F51" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Steam swirl 2 -->
  <path d="M 100 70 Q 95 60, 100 50 Q 105 40, 100 30" 
        stroke="#E76F51" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Steam swirl 3 -->
  <path d="M 115 75 Q 110 65, 115 55 Q 120 45, 115 35" 
        stroke="#E76F51" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Small lotus/leaf accent at base -->
  <path d="M 100 165 Q 90 170, 85 165 Q 90 160, 100 165 Z" fill="#2D6A4F"/>
  <path d="M 100 165 Q 110 170, 115 165 Q 110 160, 100 165 Z" fill="#2D6A4F"/>
</svg>